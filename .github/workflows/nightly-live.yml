name: Nightly live tests

# Runs the env-gated live suite against the real data.gouv.fr APIs and regenerates
# evidence reports. Offline CI never talks to the network; this workflow does.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:
    inputs:
      api_env:
        description: "DATAGOUV_API_ENV"
        type: choice
        default: prod
        options: [prod, demo]

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-live
  cancel-in-progress: false

env:
  CI: "1"
  RUN_LIVE_TESTS: "1"
  DATAGOUV_LIVE: "1"
  DATAGOUV_API_ENV: ${{ inputs.api_env || 'prod' }}
  LOG_LEVEL: warn
  EVIDENCE_AGENT: nightly-ci

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.live.outcome == 'failure' || steps.evidence.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (evidence --stdio runs dist/index.js)
        run: pnpm build

      - name: Live test suite
        id: live
        continue-on-error: true
        run: pnpm test:live

      - name: Evidence reports
        id: evidence
        continue-on-error: true
        run: |
          set -euo pipefail
          # Workstream D may ship an aggregate script; fall back to a smoke sample otherwise.
          if node -e "process.exit(require('./package.json').scripts['evidence:all'] ? 0 : 1)"; then
            pnpm evidence:all
          else
            pnpm evidence --tool search_datasets --input '{"query":"population","page_size":3}' --stdio
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: |
            docs/evidence/
            !docs/evidence/raw/
          retention-days: 30
          if-no-files-found: warn

      - name: Fail the job if any live step failed
        if: steps.live.outcome == 'failure' || steps.evidence.outcome == 'failure'
        run: |
          echo "::error::live=${{ steps.live.outcome }} evidence=${{ steps.evidence.outcome }}"
          exit 1

  report:
    # Open (or update) a single tracking issue while the nightly is red; close it when green again.
    runs-on: ubuntu-latest
    needs: live
    if: always() && github.event_name == 'schedule'
    steps:
      - uses: actions/github-script@v7
        env:
          FAILED: ${{ needs.live.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const failed = process.env.FAILED === "true";
            const title = "Nightly live tests failing";
            const label = "nightly-live";
            const { owner, repo } = context.repo;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: "B60205",
                description: "Opened automatically by the nightly live workflow" });
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label, per_page: 10,
            });
            const existing = open.find((i) => i.title === title);
            const stamp = new Date().toISOString();

            if (failed) {
              const body = [
                `The nightly live suite (\`RUN_LIVE_TESTS=1 pnpm test:live\` + evidence) failed on ${stamp}.`,
                "",
                `Run: ${process.env.RUN_URL}`,
                "",
                "Check whether data.gouv.fr / Tabular / Metrics APIs changed shape (re-record fixtures with",
                "`pnpm tsx scripts/record-fixtures.ts`) or whether a tool regressed. See `docs/development.md`.",
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                  body: `Still failing on ${stamp}: ${process.env.RUN_URL}` });
              } else {
                await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                body: `Green again on ${stamp}: ${process.env.RUN_URL}. Closing.` });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: "closed" });
            }
