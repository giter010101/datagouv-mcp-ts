name: Docker image

# Two jobs:
#   build-test — on this branch / other `cursor/**` pushes: build (no registry) + /health
#   build-push — on main and v*.*.* tags: multi-arch GHCR image with provenance/SBOM
#
#   ghcr.io/<owner>/datagouv-mcp:<semver>   on tags v*
#   ghcr.io/<owner>/datagouv-mcp:latest     on stable tags (not pre-releases)
#   ghcr.io/<owner>/datagouv-mcp:edge       on pushes to main
on:
  push:
    branches: [main, "cursor/**"]
    tags: ["v*.*.*"]
    paths-ignore:
      - "legacy/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/datagouv-mcp

jobs:
  build-test:
    name: build + /health (no push)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: datagouv-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and probe /health
        run: |
          set -euo pipefail
          docker run -d --rm --name datagouv-mcp -p 8000:8000 datagouv-mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::/health never returned 200"
          docker logs datagouv-mcp
          exit 1

      - name: Container logs
        if: always()
        run: docker logs datagouv-mcp || true

      - name: Stop container
        if: always()
        run: docker stop datagouv-mcp || true

  build-push:
    name: build and push GHCR
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=datagouv-mcp
            org.opencontainers.image.description=MCP server for data.gouv.fr
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Smoke the pushed image (/health)
        run: |
          set -euo pipefail
          docker run -d --rm --name smoke -p 8000:8000 "${IMAGE}@${{ steps.push.outputs.digest }}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs smoke; exit 1
