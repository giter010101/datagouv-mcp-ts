version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: [dependencies]
    groups:
      mcp:
        patterns: ["@modelcontextprotocol/*"]
      toolchain:
        dependency-type: development
        patterns: ["typescript", "tsdown", "tsx", "vitest", "@vitest/*", "@biomejs/*", "@types/*", "@changesets/*"]
      formats:
        patterns: ["csv-parse", "hyparquet*", "shpjs", "unpdf", "fast-xml-parser", "fflate", "chardet", "iconv-lite", "yaml"]
    ignore:
      # Node 22.14 on the dev VM cannot run tsdown 0.22+ (TD-003); bump manually with the runtime.
      - dependency-name: tsdown
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "ci"
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(docker)"
    labels: [dependencies, docker]
