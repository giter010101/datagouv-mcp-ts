components:
  schemas:
    Resource:
      properties:
        code_insee:
          type: string
        commune:
          type: string
        departement:
          type: string
        gentile:
          type: string
      type: object
    ResourceData:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Resource'
          type: array
        link:
          properties:
            next:
              description: Pagination link to the next page of the resource data
              type: string
            prev:
              description: Pagination link to the previous page of the resource data
              type: string
            profile:
              description: Link to the profile endpoint of the resource
              type: string
          type: object
        meta:
          properties:
            page:
              description: Current page
              type: integer
            page_size:
              description: Number of results per page
              type: integer
            total:
              description: Total number of results
              type: integer
          type: object
      type: object
info:
  description: Retrieve data for a specified resource with optional filtering and
    sorting.
  title: Tabular API
  version: 1.0.0
openapi: 3.0.3
