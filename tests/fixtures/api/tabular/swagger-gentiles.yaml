      name: columns
      required: false
      schema:
        type: string
      style: form
    - description: Encapsulates filters to be joined with the `OR` operator. Allows
        to build complex queries with nested `or(...)` and `and(...)` operators. Inner
        filters syntax must be `<column>.<operation>.<value>` (or `<column>.<operation>`
        for `is(not)null`), separated with commas.
